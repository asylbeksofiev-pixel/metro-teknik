{% extends "base.html" %}
{% block content %}
<div class="container notfound">
  <p class="eyebrow">404</p>
  <h1 class="mt-3">{{ t.notfound.title }}</h1>
  <p class="lead mt-4">{{ t.notfound.text }}</p>
  <p class="mt-5"><a class="btn btn--primary" href="{{ home_url }}">{{ t.notfound.home }} {{ m.icon("arrow-right", "icon--arrow") }}</a></p>
  <div class="notfound__langs">
    {%- for o in page.others %}
    <div lang="{{ o.code }}">
      <h2 class="fs-lg">{{ o.title }}</h2>
      <p class="card__text mt-2">{{ o.text }}</p>
      <p><a class="text-link" href="{{ o.home }}">{{ o.link }} {{ m.icon("arrow-right") }}</a></p>
    </div>
    {%- endfor %}
  </div>
</div>
{% endblock %}
